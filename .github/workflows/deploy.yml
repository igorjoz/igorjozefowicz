name: Test and deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-build:
    name: Tests and production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, json, tokenizer, fileinfo, pdo_sqlite
          coverage: none

      - name: Verify PHP version
        run: |
          php -r 'exit(PHP_VERSION_ID >= 80400 && PHP_VERSION_ID < 80500 ? 0 : 1);'

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies for tests
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHP tests
        run: php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test -- --run

      - name: Build frontend assets
        run: npm run build

      - name: Prepare production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Create deployment artifact
        run: |
          tar \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/testing/*' \
            --exclude='storage/framework/views/*' \
            -czf /tmp/hostinger-release.tar.gz .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-release
          path: /tmp/hostinger-release.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to production
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: hostinger-release
          path: /tmp

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          scp -i ~/.ssh/hostinger_deploy -P "$PORT" \
            /tmp/hostinger-release.tar.gz \
            "$USER@$HOST:hostinger-release.tar.gz"

      - name: Install release on Hostinger
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          ssh -i ~/.ssh/hostinger_deploy -p "$PORT" "$USER@$HOST" \
            'mkdir -p domains/igorjoz.com/igorjoz/scripts && \
             tar -xzf ~/hostinger-release.tar.gz \
               -C domains/igorjoz.com/igorjoz ./scripts/deploy-hostinger.sh && \
             bash domains/igorjoz.com/igorjoz/scripts/deploy-hostinger.sh ~/hostinger-release.tar.gz'
